title: Statuts et règlements du Mess du 9 EG
description: Statuts et règlements du Mess du 9 EG — Rouyn-Noranda
url: https://mess.9eg.ca
baseurl: ""
lang: fr-CA
theme: jekyll-theme-cayman
markdown: kramdown
show_downloads: false
source: ..
destination: ../_site
layouts_dir: site/_layouts
includes_dir: site/_includes
data_dir: site/_data
plugins_dir: ./_plugins
sass:
  sourcemap: never
exclude:
  - exports
  - tmp
  - documentation
  - versions
  - site/verifier.py
  - site/Gemfile
  - site/Gemfile.lock
  - site/README.md
  - site/.bundle
  - site/vendor
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
